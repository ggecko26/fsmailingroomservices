<!-- MASTER DIVISI SECTION -->
<div id="masterDivisiSection" class="hidden max-w-7xl mx-auto">
  <div class="bg-white rounded-3xl shadow-xl border border-slate-100 overflow-hidden">
    <div class="bg-slate-50 border-b border-slate-100 p-6 md:p-8 flex flex-col md:flex-row justify-between items-center gap-4">
      <div class="flex items-center gap-4">
        <button onclick="showSection('app')" class="w-10 h-10 flex items-center justify-center bg-white border border-slate-200 rounded-full text-slate-600 hover:bg-indigo-50 hover:text-indigo-600 transition shadow-sm">
          <i class="fa-solid fa-arrow-left"></i>
        </button>
        <div>
          <h2 class="text-2xl font-black text-slate-800 tracking-tight">
            Master <span class="text-indigo-600">Divisi</span>
          </h2>
          <p class="text-xs text-slate-500 font-medium uppercase tracking-widest">
            Update Struktur Organisasi & Lokasi Kerja
          </p>
        </div>
      </div>
      <div class="flex items-center gap-3 w-full md:w-auto">
        <button onclick="loadMasterDivisiData()" 
                class="bg-white hover:bg-slate-50 border border-slate-200 text-slate-600 px-4 py-3 rounded-2xl shadow-sm font-bold text-sm transition flex items-center gap-2" title="Refresh Data Master">
          <i class="fas fa-sync-alt"></i>
        </button>
        <button onclick="addNewMasterPrompt()" 
                class="bg-indigo-600 hover:bg-indigo-700 text-white px-6 py-3 rounded-2xl shadow-lg font-bold text-sm transition transform hover:-translate-y-1 flex items-center gap-2">
          <i class="fas fa-plus-circle"></i> Tambah Divisi/Toko Baru
        </button>
      </div>
    </div>
    <div class="p-6">
      <div class="overflow-x-auto rounded-2xl border border-slate-100">
        <table id="masterDivisiTable" class="w-full text-left border-collapse">
          <thead 
              class="bg-slate-50 text-slate-500 uppercase text-[10px] font-black tracking-widest border-b border-slate-100">
            <tr>
              <th class="p-4 w-24">Region</th> 
              <th class="p-4 w-64">Divisi / Nama Toko</th> 
              <th class="p-4 w-32">Cost Center</th>
              <th class="p-4 w-80">Alamat Divisi</th> 
              <th class="p-4 w-40">Terakhir Diubah</th>
              <th class="p-4 text-center w-32">Aksi</th>
            </tr>
          </thead>
          <tbody id="masterDivisiTableBody" class="text-sm divide-y divide-slate-50">
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>
