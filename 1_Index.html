  <script>
    // INIT VARIABEL
    let masterDivisi = [], currentUser = {}, tsInstances = {}, cardCounterId = 0, currentActivePayload = null;; 
    // cardCounterId -> ID UNIK BUAT SETIAP BLOK RESI AMAN KALO DI APUS SALAH SATU
    // currentActivePayload -> Variable global untuk menampung data yang sedang dibuka - view detail modal (dashboard)

    window.onload = function() {
      for(let i=1; i<=100; i++) { //MAKSIMAL BALIK KA 20 HUNGKUL
        document.getElementById('jumlahTujuan').innerHTML += `<option value="${i}">${i} Tujuan</option>`;
      }
      document.getElementById('inputSuperindoEmail').focus();
    };

    //JALANKEUN NALIKA HALAMAN MIMITI DIBUKA PIKEUN SET STANDAR AYEUNA-AYEUNA
    document.addEventListener("DOMContentLoaded", function() {
      const now = new Date(); //NYANDAK WAKTOS AYEUNA(WIB)
      
      const startDateObj = new Date(); //BIKIN OBJEK TANGGAL BARU KHUSUS BUAT START DATE (TODAY)
      startDateObj.setDate(now.getDate());

      //FUNGSI BUAT KONVERSI KE LOKAL ISO STRING (YYYY-MM-DD)
      //FUNGSI BIAR NGGAK NULIS RUMUS OFFSET BERKALI-KALI
      const toLocalISO = (dateObj) => {
          const offset = dateObj.getTimezoneOffset() * 60000;
          return new Date(dateObj - offset).toISOString().split('T')[0];
      };

      const startInput = document.getElementById('filterStartDate');
      const endInput = document.getElementById('filterEndDate');
      
      if (startInput && endInput) {
        const startDateValue = toLocalISO(startDateObj);
        const endDateValue = toLocalISO(now);

        startInput.value = startDateValue;
        endInput.value = endDateValue;
        endInput.min = startDateValue; //SET MINIMAL END DATE IKUTIN START DATE (TODAY)
      }
    });

    // Fungsi untuk memunculkan/menyembunyikan alert error di UI
    function tampilkanError(pesan) {
      const errorDiv = document.getElementById('loginError');
      errorDiv.innerText = pesan;
      errorDiv.classList.remove('hidden');
    }

    function sembunyikanError() {
      const errorDiv = document.getElementById('loginError');
      errorDiv.classList.add('hidden');
    }

    function showLoading(show, text = "Memproses...") {
      document.getElementById('loadingText').innerText = text;
      const loader = document.getElementById('loading');
      if (show) { 
        loader.style.display = 'flex'; 
        loader.style.position = 'fixed'; 
        loader.style.top = '0'; 
        loader.style.left = '0'; 
        loader.style.width = '100vw'; 
        loader.style.height = '100vh'; 
        loader.style.zIndex = '9999'; 
      } else { 
        loader.style.display = 'none'; 
      }
    }

    function showErrorAlert(message) {
      Swal.fire({ 
        icon: 'error', 
        title: 'Oops...', 
        text: message, 
        confirmButtonColor: '#4f46e5'
      });
    }
  </script>
