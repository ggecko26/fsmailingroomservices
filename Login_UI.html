<!-- LOGIN SCREEN -->
  <div id="loginScreen" class="fixed inset-0 z-[100] flex items-center justify-center transition-all duration-700 bg-slate-50">
    <div class="absolute inset-0 overflow-hidden pointer-events-none">
        <div class="absolute -top-[20%] -right-[10%] w-[50%] h-[50%] rounded-full bg-indigo-500/10 blur-[100px]"></div>
        <div class="absolute -bottom-[20%] -left-[10%] w-[50%] h-[50%] rounded-full bg-emerald-500/10 blur-[100px]"></div>
    </div>

    <div class="bg-white/80 backdrop-blur-2xl p-10 md:p-12 rounded-[2.5rem] shadow-2xl max-w-md w-full border border-white relative z-10 text-center mx-4">
        <div class="w-20 h-20 bg-indigo-600 rounded-3xl flex items-center justify-center text-white text-4xl shadow-lg shadow-indigo-500/30 mx-auto mb-6 transform -rotate-3 transition hover:rotate-0">
            <i class="fa-solid fa-boxes-packing"></i>
        </div>
        <h2 class="text-3xl font-black text-slate-800 tracking-tight mb-1">Mailing<span class="text-indigo-600">Services</span></h2>
        <p class="text-sm text-slate-500 font-semibold mb-8">Internal Shipping Portal</p>

        <div id="loginError" class="hidden mb-6 p-4 rounded-2xl bg-red-50/90 border border-red-100 text-red-600 text-sm font-semibold shadow-sm text-left"></div>

        <div class="mb-4 text-left relative">
            <label class="block text-sm font-bold text-slate-700 mb-2">
              Verifikasi Email Karyawan
            </label>
            <input type="email" id="inputSuperindoEmail" placeholder="nama@superindo.co.id" 
                  class="w-full border border-slate-300 rounded-xl p-4 text-slate-700 focus:outline-none focus:ring-4 focus:ring-indigo-500/20 focus:border-indigo-500 transition-all font-semibold"
                  onblur="deteksiEmail()" onkeypress="if(event.key === 'Enter') attemptLogin()">
            <p id="statusCekEmail" class="text-xs text-indigo-500 mt-2 font-medium hidden">
              <i class="fa-solid fa-circle-notch fa-spin mr-1"></i>Validasi Email...
            </p>
        </div>

        <div id="wadahPassword" class="mb-6 text-left hidden transition-all duration-300">
            <label class="block text-sm font-bold text-slate-700 mb-2">
              Password Akses <span class="text-xs font-normal text-slate-500">(Admin/Owner)</span>
            </label>
            <input type="password" id="inputPassword" placeholder="••••••••" 
            class="w-full border border-slate-300 rounded-xl p-4 text-slate-700 focus:outline-none focus:ring-4 focus:ring-indigo-500/20 focus:border-indigo-500 transition-all font-semibold"
            onkeypress="if(event.key === 'Enter') attemptLogin()">
        </div>

        <button id="btnEnter" onclick="attemptLogin()" class="w-full bg-slate-800 hover:bg-slate-900 text-white font-bold py-4 px-8 rounded-2xl shadow-xl shadow-slate-900/20 transition-all transform hover:-translate-y-1 flex items-center justify-center gap-3 active:scale-95">
            <i class="fa-solid fa-right-to-bracket text-lg"></i>
            <span>Masuk Portal</span>
        </button>

        <p class="text-[11px] text-slate-400 mt-8 font-medium"><i class="fa-solid fa-shield-halved mr-1 text-slate-300"></i> Pastikan Email sudah didaftarkan ke sistem.</p>
    </div>
  </div>
