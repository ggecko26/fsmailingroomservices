<!-- HEADER APPS AFTER LOGINED -->
<div class="max-w-6xl mx-auto flex flex-col md:flex-row justify-between items-center mb-6">
  <div class="flex items-center gap-4 mb-4 md:mb-0">
    <img id="mainLogo" src="" class="hidden h-14 object-contain">

    <div id="defaultLogo" 
          class="h-12 w-12 bg-indigo-600 rounded-xl flex items-center justify-center text-white text-2xl shadow-lg">
      <i class="fa-solid fa-boxes-packing"></i>
    </div>

    <div>
      <h1 class="text-3xl font-extrabold text-slate-800">Mailing<span class="text-indigo-600">Services</span></h1>
      <p class="text-xs text-slate-500 font-medium">Internal Shipping Portal</p>
    </div>
  </div>

  <!-- NAVIGATION BAR -->
  <div class="flex flex-col md:flex-row items-center gap-4 w-full md:w-auto">
    <div class="bg-white border border-slate-200 py-1.5 px-4 rounded-full shadow-sm flex items-center gap-2 order-2 md:order-1">
        <div class="w-2 h-2 bg-green-500 rounded-full animate-pulse"></div>
        <span id="userInfoDisplay" class="text-xs font-bold text-slate-700 whitespace-nowrap">Memuat...</span>
    </div> 

    <div class="flex flex-wrap justify-center items-center gap-2 order-1 md:order-2">
      <div class="flex items-center bg-slate-100 p-1 rounded-full border border-slate-200">
        <button onclick="showSection('app')" 
                  class="px-4 py-1.5 rounded-full text-xs font-bold transition-all hover:bg-white hover:shadow-sm text-slate-600"><i class="fa-solid fa-plus mr-1"></i> Input
        </button>
        <button onclick="loadViewDashboardData()" 
                  class="px-4 py-1.5 rounded-full text-xs font-bold transition-all hover:bg-white hover:shadow-sm text-slate-600"><i class="fa-solid fa-chart-line mr-1"></i> Dashboard
        </button>
      </div>

      <div id="adminGroup" class="hidden flex items-center gap-2 border-l border-slate-300 ml-2 pl-2">
          <button id="btnManageUsers" onclick="loadUserManagementData()" 
                    class="bg-white hover:bg-indigo-50 border border-slate-200 text-slate-700 w-9 h-9 rounded-full flex items-center justify-center transition shadow-sm" 
                    title="Pengaturan User"><i class="fa-solid fa-users-gear text-indigo-500 text-sm"></i>
          </button>

          <button id="btnManageMaster" onclick="loadMasterDivisiData()" 
                    class="bg-white hover:bg-indigo-50 border border-slate-200 text-slate-700 w-9 h-9 rounded-full flex items-center justify-center transition shadow-sm" 
                    title="Master Divisi"><i class="fa-solid fa-sitemap text-indigo-500 text-sm"></i>
          </button>

          <button id="btnAdminExport" 
                  class="bg-emerald-50 hover:bg-emerald-100 border border-emerald-200 text-emerald-700 w-9 h-9 rounded-full flex items-center justify-center transition shadow-sm" 
                  title="Export Semua Data"><i class="fa-solid fa-file-excel text-sm"></i>
          </button>

          <label id="btnUploadLogo" 
                  class="hidden cursor-pointer bg-white hover:bg-indigo-50 border border-slate-200 text-slate-700 w-9 h-9 rounded-full items-center justify-center transition shadow-sm" 
                  title="Ganti Logo">
                    <i class="fa-solid fa-camera text-indigo-500 text-sm"></i>
                    <input type="file" class="hidden" accept="image/png, image/jpeg" onchange="handleLogoUpload(event)">
          </label>
      </div>
    </div>
  </div>
</div>
