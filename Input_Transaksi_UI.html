<!-- ISI MAIN APP - FORM INPUT TRANSAKSI -->
<div id="app" class="hidden max-w-6xl mx-auto bg-white rounded-2xl shadow-xl border border-slate-100 overflow-hidden">
  <div class="p-8">
    <!-- FORM Simpan & Cetak Resi (A4) -->
    <form id="shippingForm" 
            onsubmit="event.preventDefault(); submitFormSimpanDanCetakResi();"> 
      <div class="mb-8"> <!-- SENDER AREA -->
        <div class="flex justify-between items-center w-full">
          <div class="flex items-center gap-2">
            <div class="w-8 h-8 rounded-full bg-indigo-100 text-indigo-600 flex items-center justify-center font-bold">1</div>
            <h2 class="text-lg font-bold text-slate-800">Informasi Pengirim</h2>
          </div>
          <button type="button" onclick="loadViewDashboardData()" 
              class="btn-history-glow group flex items-center gap-2 px-4 py-2 rounded-xl transition-all">
            <div class="flex flex-col text-right">
                <span class="text-[10px] font-black text-slate-400 uppercase tracking-widest leading-none group-hover:text-indigo-400">Arsip Data</span>
                <span class="text-xs font-bold text-indigo-600">RIWAYAT PENGIRIMAN</span>
            </div>
            <div class="w-8 h-8 rounded-lg bg-indigo-50 text-indigo-600 flex items-center justify-center group-hover:bg-indigo-600 group-hover:text-white transition-colors shadow-sm">
                <i class="fa-solid fa-arrow-right-to-bracket text-xs"></i>
            </div>
          </button>
        </div>
        <div class="grid grid-cols-1 md:grid-cols-3 gap-5 bg-slate-50 p-6 rounded-xl border border-slate-200">
          <div>
              <label class="premium-label">Employee Number *</label>
              <input type="text" id="empNumber" required class="premium-input">
          </div>
          <div>
              <label class="premium-label">Nama Pengirim *</label>
              <input type="text" id="senderName" required class="premium-input">
          </div>
          <div>
              <label class="premium-label">Email Superindo *</label>
              <input type="email" id="senderEmail" required class="premium-input">
          </div>
          <div>
              <label class="premium-label">Nomor HP *</label>
              <input type="text" id="senderPhone" required class="premium-input">
          </div>
          <div>
              <label class="premium-label">Region *</label>
              <select id="senderRegion" required class="premium-input" onchange="loadDivisi('sender'); checkCSO();">
                  <option value="">-- Pilih --</option>
                  <option value="CSO">CSO</option>
                  <option value="BO">BO</option>
                  <option value="DC">DC</option>
                  <option value="STORE">STORE</option>
              </select>
          </div>
          <div class="relative">
              <label class="premium-label">Divisi *</label>
              <select id="senderDivisi" required class="premium-input" placeholder="Pilih Region Dulu"></select>
              <input type="text" id="senderDivisiOther" class="hidden premium-input mt-1" placeholder="Manual divisi">
          </div>
          <div class="md:col-span-3 flex flex-wrap gap-6 py-3 px-4 bg-white rounded-lg border border-slate-200 shadow-sm mt-2">
              <div class="flex-1">
                  <p class="text-[10px] text-slate-400 font-bold uppercase tracking-wider mb-1">Cost Center</p>
                  <p class="text-sm font-semibold text-slate-800" id="lblSenderCC">-</p>
              </div>
              <div class="flex-1 border-l pl-6">
                  <p class="text-[10px] text-slate-400 font-bold uppercase tracking-wider mb-1">Alamat Lengkap</p>
                  <p class="text-sm font-semibold text-slate-800" id="lblSenderAlamat">-</p>
              </div>
          </div>
          <div id="pembebananContainer" class="hidden md:col-span-3 bg-amber-50 p-4 rounded-lg border border-amber-200 mt-2 flex items-center gap-4">
              <i class="fa-solid fa-circle-exclamation text-amber-500 text-xl"></i>
              <div class="flex-1">
                  <label class="premium-label !text-amber-800">Pembebanan Biaya (CSO) *</label>
                  <select id="pembebanan" class="premium-input !bg-white md:w-1/3 mt-1 border-amber-300">
                      <option value="Pengirim">Ditanggung Pengirim</option>
                      <option value="Penerima">Ditanggung Penerima</option>
                  </select>
              </div>
          </div>
        </div>
      </div>
      <div class="flex flex-col md:flex-row justify-between items-center mb-6 bg-indigo-50/50 p-5 rounded-xl border border-indigo-100">
          <div class="flex items-center gap-3">
              <div class="w-8 h-8 rounded-full bg-indigo-600 text-white flex items-center justify-center font-bold">2</div>
              <div>
                  <label class="block text-sm font-extrabold text-slate-800">Berapa Tujuan? *</label>
                  <select id="jumlahTujuan" class="mt-1 bg-white border border-indigo-200 text-indigo-700 text-sm rounded-lg w-32 p-2.5 font-bold shadow-sm" onchange="generateRecipientForms()"></select>
              </div>
          </div>
          <div class="flex items-center gap-3 mt-4 md:mt-0">
              <span class="text-xs font-semibold text-slate-500">Upload massal:</span>
              <button type="button" onclick="downloadTemplate()" class="bg-white text-slate-700 border border-slate-200 text-xs py-2 px-4 rounded-lg shadow-sm font-semibold hover:bg-slate-50 transition"><i class="fa-solid fa-download text-emerald-600 mr-1"></i> Template</button>
              <label class="bg-emerald-600 hover:bg-emerald-700 text-white text-xs py-2 px-4 rounded-lg shadow-sm font-semibold cursor-pointer transition">
                  <i class="fa-solid fa-file-excel mr-1"></i> Upload Excel
                  <input type="file" id="bulkUpload" class="hidden" accept=".xlsx, .xls" 
                        onclick="return checkSenderDataFirst(event)" 
                        onchange="handleExcelUpload(event)"
                  >
              </label>
          </div>
      </div>
      <div id="recipientsContainer" class="space-y-6"></div>
      <div id="addRecipientWrapper" class="mt-6 flex justify-center">
          <button type="button" onclick="addNewRecipientCard()" class="bg-indigo-50 hover:bg-indigo-100 text-indigo-600 border-2 border-dashed border-indigo-200 px-8 py-3 rounded-xl font-bold text-sm transition-all flex items-center gap-2 group">
              <i class="fa-solid fa-plus-circle group-hover:scale-110 transition-transform"></i>
              Tambah Tujuan (Maks. 100)
          </button>
      </div>
      <div class="mt-10 pt-6 flex flex-col md:flex-row justify-end gap-4">
          <button type="button" onclick="loadViewDashboardData()" class="bg-white hover:bg-slate-50 text-slate-600 font-bold py-4 px-8 rounded-2xl border-2 border-slate-200 shadow-sm transition transform hover:-translate-y-1 flex items-center justify-center text-lg">
              <i class="fa-solid fa-clock-rotate-left mr-3"></i> Lihat Riwayat Pengiriman
          </button>
          <button type="submit" class="bg-slate-800 hover:bg-slate-900 text-white font-bold py-4 px-10 rounded-2xl shadow-xl transition transform hover:-translate-y-1 flex items-center justify-center text-lg shadow-indigo-500/30">
              <i class="fa-solid fa-print mr-3"></i> Simpan & Cetak Resi (A4)
          </button>
      </div>
    </form>
  </div>
</div>
