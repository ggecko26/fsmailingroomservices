<!-- VIEW DASHBOARD SECTION -->
<div id="viewDashboardSection" class="hidden bg-white rounded-2xl shadow-xl border border-slate-100 overflow-hidden">
  <div class="bg-slate-50 border-b border-slate-100 p-6 md:p-8">
    <div class="flex flex-col md:flex-row justify-between items-center gap-6">
      <div class="flex items-center gap-4">
          <div class="w-12 h-12 bg-indigo-100 text-indigo-600 rounded-2xl flex items-center justify-center text-2xl shadow-inner">
              <i class="fa-solid fa-clock-rotate-left"></i>
          </div>
          <div>
              <h2 class="text-2xl font-black text-slate-800 tracking-tight">
                Riwayat <span class="text-indigo-600">Pengiriman</span>
              </h2>
              <p class="text-xs text-slate-500 font-medium uppercase tracking-widest">
                Pantau dan cetak ulang resi yang telah dibuat
              </p>
          </div>
      </div>
      <button onclick="showSection('app')" class="group w-full md:w-auto bg-indigo-600 hover:bg-indigo-700 text-white px-8 py-4 rounded-2xl shadow-lg shadow-indigo-200 font-bold text-lg transition-all transform hover:-translate-y-1 active:scale-95 flex items-center justify-center gap-3 animate-bounce-short">
          <i class="fas fa-plus-circle text-xl"></i>
          <span>Buat Pengiriman Baru</span>
      </button>
    </div>
  </div>
  <div class="p-6 md:p-8 bg-white">
    <div class="flex flex-wrap items-center justify-between gap-4 mb-8 p-4 bg-slate-50 rounded-2xl border border-slate-200">
      <div class="flex items-center gap-3">
        <span class="text-sm font-bold text-slate-700 mr-2">
          <i class="fa-solid fa-filter text-indigo-500 mr-1"></i> Filter Tanggal:
        </span>
        <div class="flex items-center bg-white border border-slate-300 rounded-xl px-3 py-1.5 shadow-sm">
          <input type="date" id="filterStartDate" onchange="setMinEndDate()" 
                class="outline-none text-sm font-semibold text-slate-600 bg-transparent">
          <span class="mx-2 text-slate-300">|</span>
          <input type="date" id="filterEndDate" 
                class="outline-none text-sm font-semibold text-slate-600 bg-transparent">
        </div>
        <button onclick="loadViewDashboardData()" 
            class="bg-white border border-slate-300 text-slate-700 px-4 py-2 rounded-xl hover:bg-indigo-50 hover:text-indigo-600 hover:border-indigo-200 transition-all font-bold text-sm shadow-sm">
          <i class="fas fa-sync-alt mr-2"></i>Tampilkan
        </button>
      </div>
      <button onclick="exportDashboardToExcel()" 
          class="bg-emerald-50 text-emerald-700 border border-emerald-200 px-5 py-2.5 rounded-xl hover:bg-emerald-600 hover:text-white transition-all font-bold text-sm flex items-center gap-2 shadow-sm">
          <i class="fas fa-file-excel"></i>
          <span>Download Laporan (Excel)</span>
      </button>
    </div>
    <div class="overflow-x-auto rounded-2xl border border-slate-100 shadow-sm">
      <table id="mainTableViewDashboard" class="w-full text-left border-collapse">
        <thead>
          <tr class="bg-slate-800 text-white uppercase text-[10px] font-black tracking-widest">
            <th class="p-4 rounded-tl-2xl w-[120px]">Waktu & Tanggal</th>
            <th class="p-4 w-[230px]">Info Pengirim</th>
            <th class="p-4 w-[230px]">Info Penerima</th>
            <th class="p-4 w-[80px]">Biaya</th>
            <th class="p-4 w-[120px]">Layanan</th>
            <th class="p-4 text-center w-[50px]">Qty</th>
            <th class="p-4 text-center rounded-tr-2xl w-[120px]">Opsi</th>
          </tr>
        </thead>
        <tbody id="viewDashboardTable" class="text-sm divide-y divide-slate-100"></tbody>
      </table>
    </div>
  </div>
</div>

<!-- POP UP DETAIL TRANSACTION SECTION -> PADA VIEW DASHBOARD AKSI DETAIL -->
<div id="detailModal" class="hidden fixed inset-0 z-[150] flex items-center justify-center bg-slate-900/40 backdrop-blur-sm transition-opacity opacity-0">
  <div class="bg-white rounded-2xl shadow-2xl w-full max-w-4xl mx-4 overflow-hidden transform scale-95 transition-transform duration-300" id="detailModalContent">
    <div class="bg-slate-800 px-6 py-4 flex justify-between items-center text-white">
      <h3 class="font-bold text-lg"><i class="fa-solid fa-circle-info mr-2"></i> Detail Transaksi</h3>
      <button onclick="closeDetailModal()" class="text-slate-300 hover:text-white transition"><i class="fa-solid fa-xmark text-xl"></i></button>
    </div>
    
    <div class="p-6 max-h-[70vh] overflow-y-auto">
      <div id="detailHeader" class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-6 p-4 bg-slate-50 rounded-xl border border-slate-200 text-sm">
        </div>
      <div class="overflow-x-auto">
        <table class="w-full text-left text-sm border-collapse">
          <thead>
            <tr class="border-b-2 border-slate-200 bg-slate-50">
              <th class="py-3 px-2 text-[10px] font-black text-slate-500 uppercase">Penerima</th>
              <th class="py-3 px-2 text-[10px] font-black text-slate-500 uppercase">Tujuan</th>
              <th class="py-3 px-2 text-[10px] font-black text-slate-500 uppercase">Isi Paket</th>
              <th class="py-3 px-2 text-[10px] font-black text-slate-500 uppercase">Proteksi</th>
              <th class="py-3 px-2 text-[10px] font-black text-slate-500 uppercase">Layanan</th>
              <th class="py-3 px-2 text-[10px] font-black text-slate-500 uppercase text-center">Qty</th>
            </tr>
          </thead>
          <tbody id="detailTableBody">
            </tbody>
        </table>
      </div>
    </div>
    <div class="bg-slate-50 px-6 py-4 border-t border-slate-200 flex justify-end gap-3">
      <button onclick="closeDetailModal()" class="bg-white border border-slate-300 text-slate-700 font-bold py-2 px-6 rounded-xl hover:bg-slate-100 transition">
        Tutup
      </button>
      <button id="btnPrintFromModal" class="bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-2 px-6 rounded-xl shadow-md flex items-center gap-2 transition">
        <i class="fa-solid fa-print"></i> Cetak Semua Resi
      </button>
    </div>
  </div>
</div>

<!-- POP UP EDIT TRANSACTION SECTION -->
<div id="editModal" class="hidden fixed inset-0 z-[160] flex items-center justify-center bg-slate-900/40 backdrop-blur-sm transition-opacity opacity-0">
  <div class="bg-white rounded-2xl shadow-2xl w-full max-w-4xl mx-4 overflow-hidden transform scale-95 transition-transform duration-300" id="editModalContent">
    <div class="bg-amber-500 px-6 py-4 flex justify-between items-center text-white">
      <h3 class="font-bold text-lg"><i class="fa-solid fa-pen-to-square mr-2"></i> Edit Detail Transaksi</h3>
      <button onclick="closeEditModal()" class="text-white/80 hover:text-white transition"><i class="fa-solid fa-xmark text-xl"></i></button>
    </div>
    
    <div class="p-6 max-h-[75vh] overflow-y-auto custom-scrollbar">
      <form id="editTransactionForm" class="space-y-6">
        <input type="hidden" id="editTransactionDetailId">
        
        <div class="bg-slate-50 p-4 rounded-xl border border-slate-200 grid grid-cols-2 md:grid-cols-4 gap-4">
            <div class="col-span-2 md:col-span-1">
              <label class="block text-[10px] font-black text-slate-400 uppercase mb-1">Pembebanan (Locked)</label>
              <input type="text" id="editPembebanan" disabled class="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm bg-slate-100 text-slate-500 cursor-not-allowed font-bold">
            </div>
            <div>
              <label class="block text-[10px] font-black text-slate-400 uppercase mb-1">Region (Locked)</label>
              <input type="text" id="editTujuanRegion" disabled class="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm bg-slate-100 text-slate-500 cursor-not-allowed">
            </div>
            <div>
              <label class="block text-[10px] font-black text-slate-400 uppercase mb-1">CC Pengirim</label>
              <input type="text" id="editSenderCC" disabled class="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm bg-slate-100 text-slate-500 cursor-not-allowed">
            </div>
            <div>
              <label class="block text-[10px] font-black text-slate-400 uppercase mb-1">CC Tujuan</label>
              <input type="text" id="editCCTujuan" disabled class="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm bg-slate-100 text-slate-500 cursor-not-allowed">
            </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div class="space-y-4">
              <h4 class="text-xs font-black text-indigo-600 uppercase tracking-widest border-b pb-2">Informasi Tujuan</h4>
              
              <div id="wrapperEditTujuanDivisi">
                <label class="block text-[11px] font-bold text-slate-700 mb-1">Divisi / Toko Tujuan</label>
                <input type="text" id="editTujuanDivisi" maxlength="200" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm outline-none">
              </div>
              
              <div>
                <label id="lblEditAlamatTujuan" class="block text-[11px] font-bold text-slate-700 mb-1">Alamat Lengkap</label>
                <textarea id="editAlamatTujuan" rows="2" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-amber-500 outline-none resize-none"></textarea>
              </div>
              
              <div class="grid grid-cols-2 gap-3">
                <div>
                  <label id="lblEditNamaPenerima" class="block text-[11px] font-bold text-slate-700 mb-1">Nama Penerima</label>
                  <input type="text" id="editNamaPenerima" maxlength="50" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-amber-500 outline-none">
                </div>
                <div>
                  <label class="block text-[11px] font-bold text-slate-700 mb-1">No HP Penerima</label>
                  <input type="text" id="editNoHpPenerima" maxlength="20" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-amber-500 outline-none">
                </div>
              </div>
            </div>

            <div class="space-y-4">
              <h4 class="text-xs font-black text-indigo-600 uppercase tracking-widest border-b pb-2">Detail Paket</h4>
              <div class="grid grid-cols-2 gap-3">
                <div>
                  <label class="block text-[11px] font-bold text-slate-700 mb-1">Jenis Paket</label>
                  <select id="editJenisBarang" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm outline-none">
                    <option value="Document">Document</option>
                    <option value="Non Document">Non Document</option>
                  </select>
                </div>
                <div>
                  <label class="block text-[11px] font-bold text-slate-700 mb-1">Jumlah (Qty)</label>
                  <input type="number" id="editJumlahBarang" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm outline-none" min="1">
                </div>
              </div>
              <div>
                <label class="block text-[11px] font-bold text-slate-700 mb-1">Isi / Detail Paket</label>
                <input type="text" id="editDetailBarang" maxlength="200" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm outline-none">
              </div>
              <div>
                <label class="block text-[11px] font-bold text-slate-700 mb-1">Layanan Pengiriman</label>
                <select id="editLayanan" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm outline-none">
                  <option value="Reguler">Reguler</option>
                  <option value="Urgent Express">Urgent Express</option>
                </select>
              </div>
            </div>
        </div>

        <div class="pt-4 border-t border-slate-100 grid grid-cols-2 md:grid-cols-4 gap-4">
            <div>
              <label class="block text-[11px] font-bold text-slate-700 mb-1">Packing Kayu</label>
              <select id="editPackingKayu" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm outline-none">
                <option value="Tidak">Tidak</option>
                <option value="Ya">Ya</option>
              </select>
            </div>
            <div>
              <label class="block text-[11px] font-bold text-slate-700 mb-1">Bubble Wrap</label>
              <select id="editPackingBubble" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm outline-none">
                <option value="Tidak">Tidak</option>
                <option value="Ya">Ya</option>
              </select>
            </div>
            <div>
              <label class="block text-[11px] font-bold text-slate-700 mb-1">Asuransi</label>
              <select id="editAsuransi" onchange="toggleEditAsuransi()" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm outline-none">
                <option value="Tidak">Tidak</option>
                <option value="Ya">Ya</option>
              </select>
            </div>
            <div>
              <label class="block text-[11px] font-bold text-slate-700 mb-1">Nilai Barang (Rp)</label>
              <input type="number" id="editNilaiBarang" disabled class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm bg-slate-100 outline-none">
            </div>
        </div>
      </form>
    </div>
    
    <div class="bg-slate-50 px-6 py-4 border-t border-slate-200 flex flex-col md:flex-row justify-between items-center gap-4">
      <button onclick="handleDeleteFromEdit()" class="w-full md:w-auto px-6 py-2.5 rounded-xl border border-rose-200 bg-rose-50 text-rose-600 font-bold text-sm hover:bg-rose-600 hover:text-white transition-all flex items-center justify-center gap-2">
        <i class="fa-solid fa-trash-can"></i> Hapus Transaksi
      </button>

      <div class="flex items-center gap-3 w-full md:w-auto">
        <button onclick="closeEditModal()" class="flex-1 md:flex-none bg-white border border-slate-300 text-slate-700 font-bold py-2.5 px-8 rounded-xl hover:bg-slate-100 transition shadow-sm text-sm">
          Batal
        </button>
        <button onclick="submitEditTransaction()" class="flex-1 md:flex-none bg-amber-500 hover:bg-amber-600 text-white font-bold py-2.5 px-8 rounded-xl shadow-md flex items-center justify-center gap-2 transition text-sm">
          <i class="fa-solid fa-save"></i> Simpan
        </button>
      </div>
    </div>
  </div>
</div>
