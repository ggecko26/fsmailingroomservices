<!-- ATUR PENGGUNA / MANAGE USERS SECTION -->
<div id="userManagementSection" class="hidden max-w-6xl mx-auto">
  <div class="bg-white rounded-3xl shadow-xl border border-slate-100 overflow-hidden">
    <div 
        class="bg-slate-50 border-b border-slate-100 p-6 md:p-8 flex flex-col md:flex-row justify-between items-center gap-4">
      <div class="flex items-center gap-4">
        <button onclick="showSection('app')" 
            class="w-10 h-10 flex items-center justify-center bg-white border border-slate-200 rounded-full text-slate-600 hover:bg-indigo-50 hover:text-indigo-600 transition shadow-sm">
          <i class="fa-solid fa-arrow-left"></i>
        </button>
        <div>
          <h2 class="text-2xl font-black text-slate-800 tracking-tight">
            User <span class="text-indigo-600">Control</span>
          </h2>
          <p class="text-xs text-slate-500 font-medium uppercase tracking-widest">
            Manajemen Hak Akses & Status Karyawan
          </p>
        </div>
      </div>
      <div class="flex items-center gap-3 w-full md:w-auto">
        <button onclick="loadUserManagementData()" 
              class="bg-white hover:bg-slate-50 border border-slate-200 text-slate-600 px-4 py-3 rounded-2xl shadow-sm font-bold text-sm transition flex items-center gap-2" title="Refresh Data">
          <i class="fas fa-sync-alt"></i>
        </button>
        <button onclick="addNewUserPrompt()" 
              class="bg-indigo-600 hover:bg-indigo-700 text-white px-6 py-3 rounded-2xl shadow-lg shadow-indigo-200 font-bold text-sm transition transform hover:-translate-y-1 flex items-center gap-2">
          <i class="fas fa-user-plus"></i> Tambah Akses Baru
        </button>
      </div>
    </div>
    <div class="p-6 md:p-8">
      <div class="overflow-x-auto rounded-2xl border border-slate-100">
        <table id="userTable" class="w-full text-left border-collapse">
          <thead>
            <tr class="bg-slate-50 text-slate-500 uppercase text-[10px] font-black tracking-widest border-b border-slate-100">
              <th class="p-4">Informasi Pengguna</th> 
              <th class="p-4">Level Akses (Role)</th> 
              <th class="p-4">Status Akun</th>        
              <th class="p-4">Terakhir Diubah</th>    
              <th class="p-4 text-center">Aksi</th>   
            </tr>
          </thead>
          <tbody id="userTableBody" class="text-sm divide-y divide-slate-50"></tbody>
        </table>
      </div>
    </div>
  </div>
</div>
